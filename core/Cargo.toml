# prism_core
# JNI bindings for the PRISM optical transfer codec
# Platform: Android (via ndk-build) / Desktop

[package]
name = "prism_core"
version = "0.1.0"
edition = "2021"
description = "PRISM optical transfer codec core with JNI bindings"
license = "Apache-2.0"
repository = "https://github.com/prism-ot/prism"
homepage = "https://github.com/prism-ot/prism"

[lib]
name = "prism_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
fountain_engine = "1.2"
fountain_raptor_q = "1.1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
