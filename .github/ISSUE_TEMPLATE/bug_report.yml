name: Bug report
about: Report a reproducible bug in PRISM
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A brief description of the bug
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of PRISM is affected?
      options:
        - Rust core (codec, JNI)
        - Android app (UI, camera)
        - Build system (Gradle, Cargo)
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of PRISM are you running?
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: What platform are you using?
      placeholder: e.g. Android 14, Rust 1.75, Windows 11
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the bug?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Any relevant logs or error output
      render: shell
