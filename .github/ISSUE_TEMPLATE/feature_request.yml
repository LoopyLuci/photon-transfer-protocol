name: Feature request
about: Suggest a new capability for PRISM
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome! Please provide as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A brief description of the feature
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like this feature to work?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of PRISM would this feature affect?
      options:
        - Rust core (codec, JNI)
        - Android app (UI, camera)
        - Build system (Gradle, Cargo)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions you've considered?
